name: Publicar producción en GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Comprobar y compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar aplicación
        run: npm run build
      - name: Comprobar metadatos y licencias compilados
        run: node --test test/seo.test.mjs test/licenses.test.mjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Guardar aplicación compilada
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Desplegar producción
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
