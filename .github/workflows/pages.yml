name: Publicar producción en GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Comprobar y compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci
      - name: Compilar aplicación
        run: npm run build
      - name: Ejecutar pruebas con artefactos compilados
        run: npm test
      - name: Comprobar Chrome
        run: google-chrome --version
      - name: Comprobar navegador en raíz y subruta
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/wtd-browser-logs
          npm run test:browser:build 2>&1 | tee /tmp/wtd-browser-logs/root.log
          npm run test:browser:build -- --subpath identity interface-mobile zoom shared-images csp update 2>&1 | tee /tmp/wtd-browser-logs/subpath.log
      - name: Conservar diagnóstico de navegador
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure
          path: /tmp/wtd-browser-logs
          retention-days: 7
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Guardar aplicación compilada
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Desplegar producción
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
